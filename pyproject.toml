[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeplens"
version = "0.1.0"
description = "A terminal-native, citation-grounded multi-perspective research agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DeepLens contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "textual>=0.70,<2",
  "reportlab>=4.2,<5",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
deeplens = "deeplens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deeplens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires live configured providers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
